[package]
name = "imperium-hypixel"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
async-trait = "0.1.92"
imperium-core = "0.2.0"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "macros", "tracing", "io-std", "io-util"] }
tokio-util = { version = "0.7.20", features = ["futures-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "serde_json"] }
